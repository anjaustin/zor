[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trix"
version = "1.0.0"
description = "Frozen Shape Foundry - Type a function. Get hardware."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tripp Josserand-Austin", email = "tripp@anjaustin.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering",
]
keywords = ["neural", "geometric", "compiler", "hardware", "fpga", "verilog", "cuda"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/anjaustin/trix"
Documentation = "https://github.com/anjaustin/trix#readme"
Repository = "https://github.com/anjaustin/trix"

[project.scripts]
trix = "trix.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trix*"]

[tool.setuptools.package-data]
"*" = ["*.md"]
