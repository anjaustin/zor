# Fabric: 8-input adder tree
# Sums all 8 inputs in 2 layers of parallel additions
#
# Layer 0: 4 pairwise additions
#   ALU0: in[0] + in[1]
#   ALU1: in[2] + in[3]
#   ALU2: in[4] + in[5]
#   ALU3: in[6] + in[7]
#
# Layer 1: 2 pairwise additions of Layer 0 outputs
#   ALU0: L0[0] + L0[1]  (sum of in[0..3])
#   ALU1: L0[2] + L0[3]  (sum of in[4..7])
#
# Output[0] = sum of inputs 0-3
# Output[1] = sum of inputs 4-7

fabric:
  name: adder_tree
  inputs: 8
  outputs: 2

  layers:
    # Layer 0: Pairwise additions
    - nodes:
        - shape: ADD
          a: in.0
          b: in.1
        - shape: ADD
          a: in.2
          b: in.3
        - shape: ADD
          a: in.4
          b: in.5
        - shape: ADD
          a: in.6
          b: in.7
        - shape: NOP
        - shape: NOP
        - shape: NOP
        - shape: NOP

    # Layer 1: Reduce pairs
    - nodes:
        - shape: ADD
          a: L0.0
          b: L0.1
        - shape: ADD
          a: L0.2
          b: L0.3
        - shape: NOP
        - shape: NOP
        - shape: NOP
        - shape: NOP
        - shape: NOP
        - shape: NOP
